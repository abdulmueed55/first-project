name: Probe Power Smart API Contract
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-powersmart-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe signup validation with dummy non-user data
        shell: bash
        run: |
          set +e
          out=api_probe.txt
          : > "$out"
          probe () {
            name="$1"; data="$2"
            {
              echo
              echo "===== $name ====="
              echo "BODY=$data"
              curl -sS -i --max-time 15 -A 'PowerSmart/1.0' -H 'Content-Type: application/json' -X POST --data "$data" 'https://api-powersmart.pitc.com.pk/appUser/signUp' | head -c 12000
              echo
            } >> "$out" 2>&1
          }
          probe 'empty' '{}'
          probe 'discoCode lower camel' '{"discoCode":"IESCO"}'
          probe 'DISCOCode' '{"DISCOCode":"IESCO"}'
          probe 'disco_code' '{"disco_code":"IESCO"}'
          probe 'discoCode + userType' '{"discoCode":"IESCO","userType":"Consumer"}'
          probe 'discoCode + fake mobile' '{"discoCode":"IESCO","mobileNo":"03000000000"}'
          probe 'discoCode + phone' '{"discoCode":"IESCO","phoneNumber":"03000000000"}'
          probe 'discoCode + fake email' '{"discoCode":"IESCO","email":"invalid@example.invalid"}'
      - uses: actions/upload-artifact@v4
        with:
          name: powersmart-api-probe-v2
          path: api_probe.txt
          if-no-files-found: error
