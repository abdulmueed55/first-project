name: Inspect Power Smart API
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-powersmart.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public Power Smart package
        run: |
          curl -L --fail --retry 3 'https://d.apkpure.net/b/XAPK/com.powersmart?version=latest' -o /tmp/powersmart.xapk
          mkdir -p /tmp/ps
          unzip -q /tmp/powersmart.xapk -d /tmp/ps
      - name: Install JADX
        run: |
          URL=$(curl -s https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -n 1)
          echo "$URL"
          curl -L --fail "$URL" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
      - name: Decompile and extract auth/API code
        run: |
          /tmp/jadx/bin/jadx -d /tmp/src /tmp/ps/com.powersmart.apk >/tmp/jadx.log 2>&1 || true
          {
            echo '=== JADX LOG ==='
            tail -n 80 /tmp/jadx.log
            echo
            echo '=== API URL MATCH FILES ==='
            grep -RIl 'api-powersmart.pitc.com.pk' /tmp/src | head -n 200
            echo
            echo '=== EXACT ENDPOINT CONTEXT ==='
            for term in               'api-powersmart.pitc.com.pk'               'associateRefNo'               'monthlyConsumption'               'paymentHistory'               'LoadProfile'               'verify-mpin'               'send-mpin-otp'               'signUp'               'signIn'               'smsOTPCode'               'accessToken'               'Authorization'               'Bearer'; do
              echo
              echo "##### TERM: $term #####"
              grep -RIn -m 60 -C 10 "$term" /tmp/src 2>/dev/null | head -n 1800 || true
            done
          } > api_report.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: powersmart-api-report-v3
          path: api_report.txt
          if-no-files-found: error
